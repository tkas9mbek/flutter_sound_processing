group = 'kg.cos9.flutter_sound_processing'
version = '1.0.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace = 'kg.cos9.flutter_sound_processing'

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
    }
}

dependencies {
    // json-simple 1.1.1 declares junit at compile scope; keep it out of consumers' runtime classpath.
    implementation('com.litongjava:jlibrosa:1.1.8') {
        exclude group: 'junit', module: 'junit'
    }
}
