name: flutter_sound_processing
description: Calculate MFCCs natively on Android and iOS from samples, 16-bit PCM or audio files (mp3, wav, m4a, flac).
version: 1.0.0
homepage: https://github.com/tkas9mbek/flutter_sound_processing
repository: https://github.com/tkas9mbek/flutter_sound_processing

topics:
  - audio
  - mfcc
  - signal-processing

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: kg.cos9.flutter_sound_processing
        pluginClass: FlutterSoundProcessingPlugin
      ios:
        pluginClass: FlutterSoundProcessingPlugin